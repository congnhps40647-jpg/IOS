<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyControl 0.3</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#eef1f4}button,input,select{background:#171b21;color:#eef1f4;border:1px solid #303742;border-radius:9px;padding:8px 10px}button{cursor:pointer}header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid #252b34;flex-wrap:wrap}#status{margin-left:auto}.ok{color:#8bf0a0}.bad{color:#ff8b8b}main{display:grid;grid-template-columns:minmax(300px,420px) 1fr;height:calc(100vh - 61px)}.left{border-right:1px solid #252b34;display:flex;flex-direction:column}.screenWrap{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:14px;background:#07090c;overflow:auto}#screen{display:block;max-width:100%;max-height:calc(100vh - 170px);border:1px solid #303844;border-radius:16px;background:#000}.bar{display:flex;gap:8px;padding:10px;border-bottom:1px solid #252b34;flex-wrap:wrap}.right{display:grid;grid-template-rows:auto 1fr 210px;min-width:0}textarea{width:100%;height:100%;resize:none;border:0;outline:0;padding:14px;background:#0e1116;color:#e7edf4;font:13px/1.5 ui-monospace,monospace}.console{white-space:pre-wrap;overflow:auto;padding:12px;background:#050608;border-top:1px solid #252b34;font:12px/1.5 ui-monospace,monospace}.hint{padding:9px 12px;color:#9aa5b1;font-size:12px;border-top:1px solid #252b34}@media(max-width:850px){main{grid-template-columns:1fr;height:auto}.left{border-right:0;border-bottom:1px solid #252b34;min-height:620px}.right{height:760px}#status{margin-left:0}}</style></head><body><header><strong>MyControl v0.3</strong><input id="token" type="password" placeholder="Pairing token"><button onclick="pair()">Pair</button><span id="feature">screen ? · touch pending</span><span id="status">checking…</span></header><main><section class="left"><div class="bar"><button onclick="refreshScreen()">Refresh screen</button><button id="autoBtn" onclick="toggleAuto()">Auto: ON</button></div><div class="screenWrap"><img id="screen" alt="iPhone screen"></div><div class="hint" id="info">Pair để xem màn hình iPhone. PC và iPhone phải cùng LAN.</div></section><section class="right"><div class="bar"><input id="name" value="hello.lua"><button onclick="saveScript()">Save</button><button onclick="loadScript()">Load</button><button onclick="runScript()">▶ Run Lua</button><select id="scripts"></select><button onclick="refreshList()">↻ Scripts</button></div><textarea id="editor">print("MyControl v0.3")
print("screen preview ready")
</textarea><div id="console" class="console">Nhập pairing token rồi bấm Pair.</div></section></main><script>const $=id=>document.getElementById(id);let token=localStorage.getItem('mycontrolToken')||'',auto=true,busy=false,lastURL=null;const h=decodeURIComponent(location.hash.replace(/^#/,''));if(h){token=h;localStorage.setItem('mycontrolToken',token);history.replaceState(null,'',location.pathname)}$('token').value=token;async function api(path,opts={}){const hd=Object.assign({},opts.headers||{});if(token)hd['X-MyControl-Token']=token;const r=await fetch(path,Object.assign({},opts,{headers:hd}));const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={ok:false,error:t||('HTTP '+r.status)}}if(r.status===401)throw new Error('Sai pairing token');return d}async function blob(path){const hd={};if(token)hd['X-MyControl-Token']=token;const r=await fetch(path,{headers:hd,cache:'no-store'});if(r.status===401)throw new Error('Sai pairing token');if(!r.ok)throw new Error('Screenshot HTTP '+r.status);return r.blob()}async function check(){try{const d=await api('/api/status');$('status').textContent='online :9999';$('status').className='ok';$('feature').textContent=`screen ${d.screenCapture?'✓':'✕'} · touch pending`;$('info').textContent=`points ${d.pointWidth}×${d.pointHeight} · pixels ${d.pixelWidth}×${d.pixelHeight}`;return d}catch(e){$('status').textContent='offline';$('status').className='bad'}}async function pair(){token=$('token').value.trim();localStorage.setItem('mycontrolToken',token);try{await refreshList();await check();await refreshScreen();$('console').textContent='Pair thành công.'}catch(e){$('console').textContent=e.message}}async function refreshScreen(){if(!token||busy)return;busy=true;try{const b=await blob('/api/screenshot?t='+Date.now());const u=URL.createObjectURL(b);$('screen').src=u;if(lastURL)URL.revokeObjectURL(lastURL);lastURL=u}catch(e){$('console').textContent='Screenshot: '+e.message}finally{busy=false}}function toggleAuto(){auto=!auto;$('autoBtn').textContent='Auto: '+(auto?'ON':'OFF')}async function runScript(){try{$('console').textContent='Running…';const d=await api('/api/run',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:$('editor').value});$('console').textContent=`exit=${d.exitCode}\n${d.output||''}`}catch(e){$('console').textContent=e.message}}async function saveScript(){try{const n=encodeURIComponent($('name').value||'script.lua');const d=await api('/api/save?name='+n,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:$('editor').value});$('console').textContent=d.ok?'Saved.':'Save failed: '+d.error;await refreshList()}catch(e){$('console').textContent=e.message}}async function loadScript(){try{const n=encodeURIComponent($('name').value||$('scripts').value||'script.lua');const d=await api('/api/load?name='+n);if(d.ok){$('editor').value=d.content;$('console').textContent='Loaded.'}else $('console').textContent='Load failed: '+d.error}catch(e){$('console').textContent=e.message}}async function refreshList(){const d=await api('/api/scripts');const s=$('scripts');s.innerHTML='';(d.scripts||[]).forEach(n=>{const o=document.createElement('option');o.value=o.textContent=n;s.appendChild(o)});if(s.value)$('name').value=s.value;return d}$('scripts').addEventListener('change',()=>$('name').value=$('scripts').value);setInterval(()=>{if(auto)refreshScreen()},1000);check();if(token)pair();</script></body></html>
